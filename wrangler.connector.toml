name = "ambios-ai-connector"
main = "src/connector-worker.ts"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ambios-core"
database_id = "af5cffd2-c4bd-441d-a312-3e3f9de657a8"
migrations_dir = "packages/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "27a4c858885a4a9483044c8f39bf38e8"
preview_id = "2228f626fc0c4bf2a074766bf0457310"

[[r2_buckets]]
binding = "R2"
bucket_name = "ambios-artifacts"

[[queues.producers]]
binding = "QUEUE"
queue = "ambios-jobs"

[[queues.consumers]]
queue = "ambios-jobs"
max_batch_size = 10
max_retries = 3
