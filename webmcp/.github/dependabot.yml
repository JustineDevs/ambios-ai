# See the documentation at
# https:-ai/-ai/docs.github.com-ai/en-ai/code-security-ai/reference-ai/supply-chain-security-ai/dependabot-options-reference
version: 2
updates:
  # Update actions used by .github-ai/workflows in this repository.
  - package-ecosystem: "github-actions"
    directory: "-ai/"
    schedule:
      interval: "weekly"
    groups:
      actions-org: # Groups all Github-authored actions into a single PR.
        patterns: ["actions-ai/*"]