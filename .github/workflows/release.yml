name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            const tag = process.env.RELEASE_TAG;
            const version = JSON.parse(await (await import("node:fs/promises")).readFile("package.json", "utf8")).version;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
            if (tag.slice(1) !== version) throw new Error(`Tag ${tag} does not match package version ${version}`);
          '
      - run: pnpm production:gate
      - name: Package release evidence
        run: |
          mkdir -p release-evidence
          git archive --format=tar.gz --prefix=ambios-ai-${{ github.ref_name }}/ HEAD > release-evidence/ambios-ai-${{ github.ref_name }}.tar.gz
          printf 'commit=%s\ntag=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "${{ github.ref_name }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-evidence/manifest.txt
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-evidence/ambios-ai-${{ github.ref_name }}.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-evidence/* --generate-notes --verify-tag
